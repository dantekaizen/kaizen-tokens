<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Kaizen Design System — Tokens</title>
<link rel="stylesheet" href="tokens.css">
<style>
  body {
    margin: 0;
    padding: var(--spacing-3xl);
    background: var(--color-bg-canvas);
    color: var(--color-text-primary);
    font-family: var(--family-sans), system-ui, sans-serif;
    font-size: var(--font-size-md);
    transition: background .2s, color .2s;
  }
  h1 { font-family: var(--family-display), serif; font-size: var(--font-size-3xl); margin: 0 0 var(--spacing-sm); }
  p  { color: var(--color-text-secondary); margin: 0 0 var(--spacing-2xl); }
  .card {
    background: var(--color-surface-raised);
    border: var(--border-width-sm) solid var(--color-border-default);
    border-radius: var(--radius-lg);
    padding: var(--spacing-xl);
    margin-bottom: var(--spacing-lg);
    max-width: 640px;
  }
  .btn {
    background: var(--color-bg-brand-default);
    color: var(--color-text-on-brand);
    border: none;
    border-radius: var(--radius-md);
    padding: var(--spacing-md) var(--spacing-xl);
    font: inherit;
    cursor: pointer;
  }
  .btn:hover { background: var(--color-bg-brand-hover); }
  .input {
    width: 100%;
    box-sizing: border-box;
    background: var(--color-bg-default);
    color: var(--color-text-primary);
    border: var(--border-width-sm) solid var(--color-border-default);
    border-radius: var(--radius-md);
    padding: var(--spacing-md);
    font: inherit;
  }
  .input:focus { outline: var(--border-width-md) solid var(--color-border-focus); }
  .alert {
    background: var(--color-feedback-danger-bg);
    color: var(--color-feedback-danger-text);
    border-left: var(--border-width-lg) solid var(--color-feedback-danger-solid);
    border-radius: var(--radius-sm);
    padding: var(--spacing-md) var(--spacing-lg);
  }
  .swatches { display: flex; gap: var(--spacing-sm); flex-wrap: wrap; }
  .sw { width: 64px; height: 64px; border-radius: var(--radius-md); border: var(--border-width-sm) solid var(--color-border-subtle); }
  .toggle {
    position: fixed; top: var(--spacing-lg); right: var(--spacing-lg);
    background: var(--color-bg-subtle); color: var(--color-text-primary);
    border: var(--border-width-sm) solid var(--color-border-default);
    border-radius: var(--radius-full); padding: var(--spacing-sm) var(--spacing-lg);
    font: inherit; cursor: pointer;
  }
</style>
</head>
<body>
  <button class="toggle" onclick="
    const r = document.documentElement;
    r.dataset.theme = r.dataset.theme === 'dark' ? '' : 'dark';
  ">Light / Dark</button>

  <h1>Kaizen Design System</h1>
  <p>Cada valor de esta página viene de las variables de Figma.</p>

  <div class="card">
    <div class="swatches">
      <div class="sw" style="background: var(--color-bg-brand-default)"></div>
      <div class="sw" style="background: var(--color-feedback-success-solid)"></div>
      <div class="sw" style="background: var(--color-feedback-warning-solid)"></div>
      <div class="sw" style="background: var(--color-feedback-danger-solid)"></div>
      <div class="sw" style="background: var(--color-feedback-info-solid)"></div>
    </div>
  </div>

  <div class="card">
    <input class="input" placeholder="Escribe algo…">
  </div>

  <div class="card"><button class="btn">Primary action</button></div>

  <div class="card"><div class="alert">Algo salió mal. Revisa los datos e intenta de nuevo.</div></div>
</body>
</html>
